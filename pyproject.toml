[project]
name = "nba-per"
version = "0.2.0"
description = "Leakage-aware evaluation of NBA Player Efficiency Rating (PER) models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[tool.uv]
package = false
